// ===================== 全局工具函数 =====================
// Toast轻提示
function showToast(msg, delay = 1500) {
    const toast = document.getElementById('toastBox');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', delay);
}
// 显示加载
function showLoad() { document.getElementById('loadBox').style.display = 'block';}
// 关闭加载
function closeLoad() { document.getElementById('loadBox').style.display = 'none';}
// 关闭全局弹窗
function closeModal() {
    const mask = document.getElementById('modalMask');
    const box = document.getElementById('modalBox');
    mask.style.display = 'none';
    box.innerHTML = '';
    box.className = 'modal-box';
	document.body.classList.remove("modal-open");
}
// 打开弹窗，自定义内容、标题、按钮
function openModal(html, isVideo = false, isPic = false, isFormModal = false) {
    const mask = document.getElementById('modalMask');
    const box = document.getElementById('modalBox');
    box.innerHTML = html;
    box.className = 'modal-box';
    if(isVideo) box.classList.add('video-modal');
    if(isPic) box.classList.add('pic-modal');
    if(isFormModal) box.classList.add('form-modal');
    mask.style.display = 'flex';
	document.body.classList.add("modal-open");
    mask.onclick = function(e){
        if(e.target !== mask) return;
        if(box.classList.contains('form-modal')){
            return;
        }
        closeModal();
    }
    box.onclick = function(e){
        e.stopPropagation();
    }
}

async function GP_data(txt, options = {}, callback) {
    const {method = 'POST',data = {},timeout = 30000 } = options;
    const APIurl = "https://api.rmbk.cc/i6x.php?type=" + txt;
    showLoad();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
        let fetchOpt = {method,signal: controller.signal,headers: {'Content-Type': 'application/x-www-form-urlencoded'} };
        if(method !== 'GET'){
            const params = new URLSearchParams();
            for(let k in data) params.append(k, data[k]);
            fetchOpt.body = params.toString();
        }
        const res = await fetch(APIurl, fetchOpt);
        const list = await res.json();
        callback(list);
    } catch (err) {
        callback({msg:false,data:'请求超时！'});
    } finally {
        clearTimeout(timer);
        closeLoad();
    }
}

// 获取今日日期
function getToday() {
    let date = new Date();
    let Y = date.getFullYear();
    let M = date.getMonth()+1;
    let D = date.getDate();
    let H = date.getHours();
    return `${Y}-${M}-${D}-${H}`;
}
// 回到顶部
function scrollToTop() {
    let scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    if (scrollTop > 0) {
        window.requestAnimationFrame(scrollToTop);
        window.scrollTo(0, scrollTop - scrollTop / 10);
    }
}
// 复制文本
function copyContent(divElement) {
    const tempTextarea = document.createElement('textarea');
    tempTextarea.value = divElement.innerText;
    tempTextarea.style.position = 'fixed';
    document.body.appendChild(tempTextarea);
    tempTextarea.select();
    document.execCommand('copy');
    document.body.removeChild(tempTextarea);
    showToast('复制成功');
}

// ===================== 轮播图 =====================
window.onload = function(){
    const images = document.getElementById("slideshow").getElementsByTagName("img");
    let pos = 0;
    const len = images.length;
    setInterval(function(){
        images[pos].style.display = 'none';
        pos = ++pos == len ? 0 : pos;
        images[pos].style.display = 'inline';
    },1500);
};

// ===================== 滚动加载vlog =====================
let page = 0;
let isClick = true;
window.addEventListener('scroll', function () {
    const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight;
    const clientHeight = document.documentElement.clientHeight;
    const totalHeight = parseFloat(clientHeight) + parseFloat(scrollTop);
    if ((scrollHeight - totalHeight < 100) && isClick) {
        isClick = false;
        ++page;
        const CATCH_DATA_KEY = 'DATA_' + page;
        const CATCH_DATA = window.localStorage.getItem(CATCH_DATA_KEY);
        let data = null;
        try{
            data = JSON.parse(CATCH_DATA);
        }catch(e){}
        if (data && data.validDate === getToday()) {
            renderList(data.vlog);
            const Click = data.vlog.msg;
            setTimeout(function() {isClick = Click;}, 5000);
        } else {
            GP_data("vlog&p="+page,{method:'GET'},function(vlog){
                window.localStorage.setItem(CATCH_DATA_KEY, JSON.stringify({ vlog, validDate: getToday() }));
                renderList(vlog);
                const Click = vlog.msg;
                setTimeout(function() {isClick = Click;}, 5000);
            });
        }
    }
});

// 渲染动态列表
function renderList(List) {
    if (List.msg == false){
        showToast(List.data);
        document.getElementById('othe').innerText = List.data;
    } else {
        const vlog = List.data;
        const vlogWrap = document.getElementById('vlog');
        for (let i = 0; i < vlog.length; i++) {
            const cards = vlog[i].cards;
            const title = vlog[i].title;
            let outimg = "";
            let css = "";
            if (cards.length === 1){
                css = "width:65%;padding-bottom:35%;";
            }
            for (let ii = 0; ii < cards.length; ii++) {
                const imgurl = cards[ii].img_url;
                const origin = cards[ii].img_url_big;
                const video  = cards[ii].mp4_url || '';
                const safeImg = imgurl.replace(/"/g,'&quot;');
                const safeOrigin = origin.replace(/"/g,'&quot;');
                const safeVideo = video.replace(/"/g,'&quot;');
                if (video.trim() === ""){
                    outimg += `<li style="background-image:url(${safeImg});background-position:center;background-size:cover;${css}" onclick="player('${safeOrigin}','pic')"></li>`;
                }else{
                    outimg += `<li style="background-image:url(${safeImg});background-position:center;background-size:cover;${css}" onclick="player('${safeVideo}','video','${safeImg}')">
                        <svg class="play-btn" width="36" height="36"><circle cx="18" cy="18" fill="#FFF" fill-opacity=".80" r="18"></circle><path d="M25.417 18.53L14.738 24.985a0.6 0.6 0 0 1-.832-.215 0.625 0.625 0 0 1-.085-.315V11.545c0-.341.271-.617.606-.617.11 0 .216.03.31.086l10.68 6.455a0.622 0.622 0 0 1 0 1.06z" fill="#444" fill-rule="nonzero"></path></svg>
                    </li>`;
                }
            }
            const itemHtml = `<div class="itemg">
                <div class="itemg_lf"><img src="https://qnm.hunliji.com/FmXDfI8uZWhVnt9Bpc6ueJLXVHw4"></div>
                <div class="itemg_rg">
                    <div class="itemg_rg_tp">
                        <div class="app_sm_lf"><span><em>爱·影像 i6x.cn</em></span></div>
                        <div class="app_sm_rg"></div>
                    </div>
                    <div class="itemg_rg_sm"><p>${title}</p></div>
                    <div class="itemg_rg_main"><ul>${outimg}</ul></div>
                </div>
            </div>`;
            vlogWrap.innerHTML += itemHtml;
        }
    }
}

            <input type="text" id="temp_riqi" class="prompt-input" placeholder="请输入拍摄日期，如20190501">
            <input type="text" id="temp_kehu" class="prompt-input" placeholder="请输入客户姓名">
        </div>
        <div class="prompt-btn-box" style="justify-content:flex-end;">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" onclick="wedSubmitHandler()">确定</button>
        </div>
    </div>
    `;
    window.wedSubmitHandler = function(){
        const rVal = document.getElementById('temp_riqi').value.trim();
        const kVal = document.getElementById('temp_kehu').value.trim();
        if(rVal.length < 8){
            showToast('日期格式错误');
            return;
        }
        if(kVal.length < 2){
            showToast('请填写姓名');
            return;
        }
        GP_data("wed",{data:{time:rVal,name:kVal}},res=>{
            closeModal();
            if(!res.msg){
                showToast(res.data);
            }else{
                openModal(`<div onclick="copyContent(this)" style="padding:15px;">${res.data}</div>`);
            }
        })
    };
	openModal(modalHtml, false, false, true);
    setTimeout(()=>{
        document.getElementById('temp_riqi').focus();
    }, 60);
}

// ===================== 预约留言弹窗 =====================
function reserve() {
    const num1 = Math.floor(Math.random() * 9) + 1;
    const num2 = Math.floor(Math.random() * 9) + 1;
    const modalHtml = `
    <div class="prompt-wrap">
        <p class="prompt-title">💬 欢迎留言</p>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
            <input type="text" id="res_xm" class="prompt-input" placeholder="请输入您的姓名">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;width:100%;">
                <input type="text" id="res_pw" class="prompt-input" style="flex:1;min-width:0;min-width:120px;box-sizing:border-box;" placeholder="请输入右侧答案">
                <span style="white-space:nowrap;padding-left:6px;">${num1} + ${num2}</span>
            </div>
            <input type="text" id="res_tt" class="prompt-input" placeholder="请输入预约内容、联系方式">
        </div>
        <div class="prompt-btn-box" style="justify-content:flex-end;">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" onclick="reserveSubmit()">确定</button>
        </div>
    </div>
    `;
    window.reserveSubmit = function () {
        const name = document.getElementById('res_xm').value.trim();
        const answer = document.getElementById('res_pw').value.trim();
        const content = document.getElementById('res_tt').value.trim();
        const rightAnswer = num1 + num2;
        if (name.length < 2) {
            showToast('请填写您的姓名');
            return;
        }
        if (Number(answer) !== rightAnswer) {
            showToast('验证码答案错误');
            return;
        }
        if (content.length < 3) {
            showToast('请填写预约内容与联系方式');
            return;
        }
        GP_data("res", {
            data: {
                name: name,
                txt: content
            }
        }, function (res) {
            closeModal();
            if (res.type === 1) {
                const reserveWrap = document.getElementById('vlog');
                const list = res.data;
                list.forEach(item => {
                    const itemHtml = `
                    <div class="itemg" id="${item.id}">
                        <div class="itemg_lf">
                            <span style="color:red;line-height:50px;cursor:pointer;" onclick="resdel('${item.id}','${item.name}',${item.id})">❌</span>
                        </div>
                        <div class="itemg_rg">
                            <div class="itemg_rg_tp">
                                <div class="app_sm_lf"><span><em>${item.name}</em></span></div>
                                <div class="app_sm_rg"><span>${item.time}</span></div>
                            </div>
                            <div class="itemg_rg_sm"><p>${item.txt}</p></div>
                        </div>
                    </div>`;
                    reserveWrap.innerHTML += itemHtml;
                });
            } else {
                showToast(res.data);
            }
        });
    };
    openModal(modalHtml, false, false, true);
    setTimeout(() => {
        document.getElementById('res_xm').focus();
    }, 60);
}
function resdel(iSel,n,id){
    if (!confirm('确定删除这条留言？删除无法恢复')) return;
    GP_data("res",{data:{land:n,del:id}},function(list){
        if (list.msg) {
            const delLi = document.getElementById(id);
            if(delLi) delLi.remove();
            showToast(list.data);
        } else {
            showToast(list.data);
        }
    });
}

// ===================== 图片/视频预览 =====================
function player(url,type,img) {
    showLoad();
    if (type == "pic"){
        const pic = new Image();
        pic.src = url;
        pic.onload = function () {
            const html = `<img width="100%" src="${url}" onclick="closeModal()">`;
            openModal(html, false, true);
            closeLoad();
        }
        pic.onerror = function() {
            closeLoad();
            showToast('图片加载失败');
        }
    }else if(type == "video"){
        const html = `<video id="myVideo" controls width="100%" height="100%" oncontextmenu="return false;" controlslist="nodownload" poster="${img}" x5-playsinline="true" playsinline="true" webkit-playsinline="true" x-webkit-airplay="true" x5-video-orientation="portraint">
            <source src="${url}" type="video/mp4">
        </video>`;
        openModal(html, true);
        closeLoad();
        // 自动播放
        setTimeout(()=>{
            const video = document.getElementById('myVideo');
            if(video){
                video.play();
                video.addEventListener('ended',()=>video.play());
                video.addEventListener('touchstart',closeModal);
            }
        }, 100);
    }
}
