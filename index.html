<script type="text/javascript">
//全局事件委托图片预览
document.addEventListener('click',function(e){
    const el = e.target.closest('[data-eject]');
    if(el){
        const url = el.dataset.ejectUrl;
        eject(url);
    }
})

window.onload = function(){
    const images = document.getElementById("slideshow").getElementsByTagName("img");
    let pos = 0;
    const len = images.length;
    setInterval(function(){
        images[pos].style.display = 'none';
        pos = ++pos == len ? 0 : pos;
        images[pos].style.display = 'block';
    },1500);
};
let page = 0;
let isClick = true;
window.addEventListener('scroll', function () {
    const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight;
    const clientHeight = document.documentElement.clientHeight;
    const totalHeight = parseFloat(clientHeight) + parseFloat(scrollTop);
    if ((scrollHeight - totalHeight < 100) && isClick) {
        isClick = false;
        ++page;
        const CATCH_DATA_KEY = 'vlog_' + page;
        const CATCH_DATA = window.localStorage.getItem(CATCH_DATA_KEY);
        let data = null;
        try{ data = JSON.parse(CATCH_DATA); }catch(e){}
        if (data && data.validDate === getToday()) {
            renderList(data.vlog);
            setTimeout(function() {isClick = true;}, 5000);
        } else {
            GP_data("vlog&p="+page,{method:'GET'},function(vlog){
                window.localStorage.setItem(CATCH_DATA_KEY, JSON.stringify({ vlog, validDate: getToday() }));
                renderList(vlog);
                setTimeout(function() {isClick = true;}, 5000);
            });
        }
    }
});
function renderList(List) {
    if (List.msg == false){
        showToast(List.data);
        document.getElementById('othe').innerText = List.data;
    } else {
        const vlog = List.data;
        const vlogWrap = document.getElementById('vlog');
        for (let i = 0; i < vlog.length; i++) {
            const item = vlog[i];
            const title = item.txt;
            const imgArr = item.img.split(',').filter(s=>s.trim()!=='');
            let outimg = "";
            for (let ii = 0; ii < imgArr.length; ii++) {
                const imgurl = imgArr[ii].trim();
                outimg += `<li data-eject data-eject-url="${imgurl}" style="background-image:url(${imgurl});background-position:center;background-size:cover;"></li>`;
            }
            const itemHtml = `<div class="itemg">
                <div class="itemg_lf"><img src="https://qnm.hunliji.com/FmXDfI8uZWhVnt9Bpc6ueJLXVHw4"></div>
                <div class="itemg_rg">
                    <div class="itemg_rg_tp">
                        <div class="app_sm_lf"><span><em>爱·影像 i6x.cn</em></span></div>
                        <div class="app_sm_rg"></div>
                    </div>
                    <div class="itemg_rg_sm"><p>${title}</p></div>
                    <div class="itemg_rg_main"><ul>${outimg}</ul></div>
                </div>
            </div>`;
            vlogWrap.innerHTML += itemHtml;
        }
    }
}
// 验证码
function drawVerifyCode(type) {
    const canvasId = `${type}_code_canvas`;
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const a = Math.floor(Math.random() * 90) + 10;
    const b = Math.floor(Math.random() * 90) + 10;
    const answer = a + b;
    window._verify = window._verify || {};
    window._verify[type] = answer;
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const text = `${a} + ${b} = ?`;
    ctx.font = '15px Arial';
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';
    ctx.fillText(text, canvas.width / 2, 24);
}
// ========== 客片查询 ==========
function wedList() {
    const modalHtml = `
        <p class="prompt-title">🔍 客片查询</p>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
            <input type="text" id="temp_riqi" class="prompt-input" placeholder="请输入拍摄日期，如20090101">
            <input type="text" id="temp_kehu" class="prompt-input" placeholder="请输入客户姓名">
            <div class="verify-row">
                <input type="text" id="wed_code_input" class="prompt-input" placeholder="请输入算式结果">
                <canvas id="wed_code_canvas" width="100" height="36" style="border:1px solid #ddd;border-radius:4px;cursor:pointer;"></canvas>
            </div>
        </div>
        <div class="prompt-btn-box" style="justify-content:flex-end;">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button id="wed_submit_btn" class="btn-confirm">确定</button>
        </div>
    `;
    openModal(modalHtml, false, true);
    setTimeout(() => {
        drawVerifyCode('wed');
        const canvas = document.getElementById('wed_code_canvas');
        canvas.onclick = () => drawVerifyCode('wed');
        document.getElementById('wed_submit_btn').onclick = wedSubmitHandler;
    }, 0);

    function wedSubmitHandler(){
        const btn = document.getElementById('wed_submit_btn');
        if (btn.disabled) return;
        const rVal = document.getElementById('temp_riqi').value.trim();
        const kVal = document.getElementById('temp_kehu').value.trim();
        const userCode = document.getElementById('wed_code_input').value.trim();
        const rightAnswer = (window._verify || {}).wed;
        if (!/^\d{8}$/.test(rVal)) {
            showToast('日期格式错误');
            document.getElementById("temp_riqi").value = "";
            document.getElementById('temp_riqi').focus();
            return;
        }
        const y = Number(rVal.slice(0, 4));
        const m = Number(rVal.slice(4, 6));
        const d = Number(rVal.slice(6, 8));
        const dateObj = new Date(y, m - 1, d);
        if (dateObj.getFullYear() !== y || dateObj.getMonth() !== m - 1 || dateObj.getDate() !== d) {
            showToast('不是有效的日期，请重新输入');
            document.getElementById('temp_riqi').focus();
            return;
        }
        if (kVal.length < 3) {
            showToast('请输入客户姓名');
            document.getElementById('temp_kehu').focus();
            return;
        }
        if (userCode === '') {
            showToast('请输入算式结果');
            document.getElementById('wed_code_input').focus();
            return;
        }
        if (Number(userCode) !== rightAnswer) {
            showToast('这都能算错？再来一次！');
            document.getElementById('wed_code_input').value = '';
            drawVerifyCode('wed');
            document.getElementById('wed_code_input').focus();
            return;
        }
        btn.disabled = true;
        btn.style.opacity = '0.6';
        closeModal();
        GP_data("wed", { data: { time: rVal, name: kVal } }, res => {
            delete window._verify.wed;
            if (res.msg) {
                // 使用DOM textContent 防XSS，不拼接HTML
                const box = document.getElementById('modalBox');
                box.innerHTML = `<div style="padding:10px;cursor:pointer;" onclick="copyContent(this)">
                    <p></p><p></p><p></p><p></p>
                </div>`;
                const divWrap = box.querySelector('div');
                divWrap.querySelectorAll('p')[0].textContent = res.data.txt||'';
                divWrap.querySelectorAll('p')[1].textContent = res.data.url||'';
                divWrap.querySelectorAll('p')[2].textContent = res.data.key||'';
                divWrap.querySelectorAll('p')[3].textContent = res.data.marks||'';
                box.className = 'modal-box';
                const mask = document.getElementById('modalMask');
                mask.style.display='flex';
                document.body.classList.add("modal-open");
            } else {
                showToast(res.data);
            }
        })
    }
}

function reserve() {
    const modalHtml = `
        <p class="prompt-title">💬 欢迎留言</p>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
            <input type="text" id="res_xm" class="prompt-input" placeholder="请输入您的姓名">
            <input type="text" id="res_tt" class="prompt-input" placeholder="请输入预约内容 及 联系方式">
            <div class="verify-row">
                <input type="text" id="res_code_input" class="prompt-input" placeholder="请输入算式结果">
                <canvas id="res_code_canvas" width="100" height="36" style="border:1px solid #ddd;border-radius:4px;cursor:pointer;"></canvas>
            </div>
        </div>
        <div class="prompt-btn-box" style="justify-content:flex-end;">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button id="res_submit_btn" class="btn-confirm">确定</button>
        </div>
    `;
    openModal(modalHtml, false, true);
    setTimeout(() => {
        drawVerifyCode('res');
        const canvas = document.getElementById('res_code_canvas');
        canvas.onclick = () => drawVerifyCode('res');
        document.getElementById('res_submit_btn').onclick = reserveSubmit;
    }, 0);

    function reserveSubmit(){
        const btn = document.getElementById('res_submit_btn');
        if (btn.disabled) return;
        const name = document.getElementById('res_xm').value.trim();
        const content = document.getElementById('res_tt').value.trim();
        const userCode = document.getElementById('res_code_input').value.trim();
        const rightAnswer = (window._verify || {}).res;
        const chineseReg = /^[\u4e00-\u9fa5]{2,}$/;
        if (!chineseReg.test(name)) {
            showToast('请填写至少2个汉字的真实姓名');
            document.getElementById('res_xm').focus();
            return;
        }
        if (content.length < 11) {
            showToast('请填写预约内容与联系方式');
            document.getElementById('res_tt').focus();
            return;
        }
        if (userCode === '') {
            showToast('请输入算式结果');
            document.getElementById('res_code_input').focus();
            return;
        }
        if (Number(userCode) !== rightAnswer) {
            showToast('这都能算错？再来一次！');
            document.getElementById('res_code_input').value = '';
            drawVerifyCode('res');
            document.getElementById('res_code_input').focus();
            return;
        }
        btn.disabled = true;
        btn.style.opacity = '0.6';
        closeModal();
        GP_data("res", { data: { name: name, txt: content } }, function (res) {
            showToast(res.data);
            delete window._verify.res;
        });
    }
}
function eject(url) {
    showLoad();
    const pic = new Image();
    pic.src = url;
    pic.onload = function () {
        openModal(`<img width="100%" src="${url}" onclick="closeModal()">`, true);
        closeLoad();
    }
    pic.onerror = function() {
        closeLoad();
        showToast('图片加载失败');
    }
}
function showToast(msg, delay = 1700) {
    const toast = document.getElementById('toastBox');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', delay);
}
function showLoad() { document.getElementById('loadBox').style.display = 'block';}
function closeLoad() { document.getElementById('loadBox').style.display = 'none';}
function closeModal() {
    const mask = document.getElementById('modalMask');
    const box = document.getElementById('modalBox');
    mask.style.display = 'none';
    box.innerHTML = '';
    box.className = 'modal-box';
    document.body.classList.remove("modal-open");
}
function openModal(html, isPic = false, isFormModal = false) {
    const mask = document.getElementById('modalMask');
    const box = document.getElementById('modalBox');
    const closeBtnHtml = isPic ? '' : `<button class="modal-close-btn" onclick="closeModal()">×</button>`;
    box.innerHTML = closeBtnHtml + html;
    box.className = 'modal-box';
    if(isPic) box.classList.add('pic-modal');
    if(isFormModal) box.classList.add('form-modal');
    mask.style.display = 'flex';
    document.body.classList.add("modal-open");
    mask.onclick = function(e){
        if(e.target !== mask) return;
        //表单弹窗禁止点击背景关闭
        if(isFormModal) return;
        closeModal();
    }
    box.onclick = function(e){ e.stopPropagation(); }
}
function getToday() {
    let date = new Date();
    let Y = date.getFullYear();
    let M = date.getMonth()+1;
    let D = date.getDate();
    let H = date.getHours();
    return `${Y}-${M}-${D}-${H}`;
}
function scrollToTop() {
    let scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    if (scrollTop > 0) {
        window.requestAnimationFrame(scrollToTop);
        window.scrollTo(0, scrollTop - scrollTop / 10);
    }
}
async function copyContent(divElement) {
    try {
        await navigator.clipboard.writeText(divElement.innerText);
        showToast('复制成功');
    } catch(e) {
        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = divElement.innerText;
        tempTextarea.style.position = 'fixed';
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextarea);
        showToast('复制成功');
    }
}
async function GP_data(txt, options = {}, callback) {
    const {method = 'POST',data = {},timeout = 30000 } = options;
    const APIurl = "https://api.rmbk.cc/i6x.php?type=" + txt;
    showLoad();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
        const fetchOpt = {method,signal: controller.signal };
        if(method !== 'GET'){
            fetchOpt.headers = {'Content-Type': 'application/x-www-form-urlencoded'};
            const params = new URLSearchParams();
            for(let k in data) params.append(k, data[k]);
            fetchOpt.body = params.toString();
        }
        const res = await fetch(APIurl, fetchOpt);
        if(!res.ok) throw new Error('http status:'+res.status);
        const list = await res.json();
        callback(list);
    } catch (err) {
        callback({msg:false,data:'请求异常：'+String(err.message)});
    } finally {
        clearTimeout(timer);
        closeLoad();
    }
}
