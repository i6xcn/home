<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>API</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Web App">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<style type="text/css">
*{margin:0;padding:0;box-sizing:border-box;}
body{color:#051b28;font-size:15px;background-color:#eee;}
img{border:0;vertical-align:middle;object-fit:cover;}
ul,li{list-style:none;}
a{text-decoration:none}
button{border:none;cursor:pointer;font-size:15px;white-space:nowrap;}
input{outline:none;border:none;font-family:inherit;}
@keyframes spin{to{transform:rotate(360deg);}}
.contant{background:#fff;max-width:640px;min-width:320px;margin:0 auto;position:relative;padding-bottom:40px;}
.header{padding-top:60px;background:#ff5983;}
.top{background:#fff;height:60px;overflow:hidden;}
.logo{position:absolute;left:50%;width:75px;height:75px;background-repeat:no-repeat;background-position:center;background-size:cover;border-radius:100%;margin:0 auto;overflow:hidden;transform:translate(-50%,-50%);}
.navbar{border-bottom:#EDEDED 1px solid;overflow:hidden;}
.navbar li{float:left;width:25%;text-align:center}
.navbar li a{display:block;padding:8px 0;font-size:17px;color:#858585}
.navbar li a:hover{color:#ff5983;background:#eeeeee;}
.navbar li a.xhx{color:#ff5983!important;border-bottom:#ff5983 2px solid;display:block}
.itemg { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
.itemg_lf{float:left;}
.itemg_lf img { width: 48px; height: 48px; border-radius: 50%; }
.itemg_rg { flex: 1; }
.itemg_rg_tp{color:#C8C8C8;overflow:hidden;}
.itemg_rg_tp div{width:50%;float:left}
.itemg_rg_tp h4 { margin: 0; font-size: 16px; color: #0066cc; }
.itemg_rg_sm {color: #666; margin:10px 0; }
.itemg_rg_main{overflow:hidden;}
.itemg_rg_main ul{display:flex;flex-wrap: wrap;}
.bottom{max-width:640px;min-width:320px;width:100%;position:fixed;display:flex;line-height:40px;height:40px;bottom:0;background:#ff5983;z-index:10000;}
.bottom .childdiv{flex:1;text-align:center;}
.bottom a{color:#fff;}
.wrapper {margin:10px;display:none;}
.wrapper .search{display: flex;align-items: center;justify-content:center;width:315px;height:50px;margin:15px auto;box-sizing: border-box;}
.wrapper .search-input{flex: 1;box-sizing:border-box;padding:10px;height:100%;background-color:#f7f7f7;border-radius: 9px 0 0 9px;border: 1px solid #ff5983;display:block;overflow:hidden;}
.input-wrapper{display:flex;position:relative;width:100%;height:100%;flex-direction:column;justify-content:center;}
.input{background:none;font-size:16px;height:28px;line-height:28px;width:100%;}
.wrapper .search-btn{display:flex;align-items:center;justify-content:center;height:100%;width:75px;background-color:#ff5983;color:#fff;font-size:16px;font-weight: 700;border-radius: 0 9px 9px 0;cursor: pointer;}
.wrapper .result-list{}
.wrapper .result-list-item{padding:10px;position:relative;margin-top:10px;color:#1e80ff;border: 1px dashed #ccc;border-radius:10px;}
.wrapper .result-content {display:flex;}
.wrapper .result-content-left {width: calc(100% - 50px);display:flex;gap: 5px;align-items: center;}
.wrapper .result-value{width:100%;}
.wrapper .result-value a{color: #1e80ff;}
.wrapper .result-logo{width:16px;height:15px;border-radius:100%;margin-right: 5px;display:block;background-position: 0% 0%;background-size:100% 100%;background-repeat:no-repeat;}
.wrapper .result-list-value{width:100%;text-align:right;}
.wrapper .result-list-right{width:50px;display:flex;align-items:center;}
.wrapper li{display:inline-block;width:23%;margin: 0 1% 8px 1%;position:relative;border-radius:8px;cursor:pointer;}
.wrapper span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;}
@media (max-width: 599px) { .wrapper li {width:31%;} }
.Pic-label{text-align:center;line-height:30px;}
#PicUpload {border: 2px dashed #ccc;text-align:center;padding:20px;margin: 10px auto;height:100px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;}
#PicUpload:hover { border: 2px dashed #ff5983;}
#PicUpload.highlight {border-color: #4CAF50;background-color: #f8f8f8;}
fieldset{padding:0 10px 10px;margin: 10px 0;border:1px solid #ccc;}
legend{text-align:center;padding:0 10px;}
label{position:relative;cursor:pointer;padding:0 6px;}
label::after{content:attr(data-hover);display:none;position:absolute;left:50%;top:100%;transform:translateX(-50%);background-color:#ff5983;padding:0 6px;color:#FFF;font-size:12px;border-radius:4px;white-space:nowrap;}
label:hover::after {display:block;}
.loadMore{cursor:pointer;display:block;position:relative;line-height:57px;text-align:center;width:100%;color:#10aae4}
.load-more-btn { text-align: center; padding: 14px; cursor: pointer; }
#toast-box{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 16px;border-radius:4px;z-index:9999;display:none;white-space:nowrap;}
#loading-box{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;display:none;align-items:center;justify-content:center;}
.load-spin{width:30px;height:30px;border:3px solid #ff5983;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;}
body.modal-open { overflow: hidden !important; height: 100vh !important; }
#modal-mask{ position:fixed; top:0;left:0; width:100%;height:100%; background:rgba(0,0,0,0.8); z-index:10; display:none; align-items:center; justify-content:center; padding:15px; box-sizing:border-box; }
#modal-box { width: calc(640px * 0.9); background: #ffffff; max-width: 90vw; max-height: 85vh; border-radius: 6px; box-sizing: border-box; overflow: hidden !important; display: flex; flex-direction: column; }
#modal-box .modal-scroll-wrap { flex: 1; overflow-y: auto; overflow-x: hidden;cursor: pointer;}
#modal-box .modal-scroll-wrap p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#modal-box.video-modal { background: transparent !important; padding: 0 !important; overflow: hidden !important; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#modal-box.video-modal video { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; display: block; pointer-events: none; }
.prompt-wrap { padding: 10px; }
.prompt-title { font-size: 16px; margin: 0 0 12px 0; color: #333; }
.prompt-row-flex { display: flex; align-items: center; gap: 10px; }
.prompt-input {width: 100%;box-sizing: border-box; padding: 9px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; outline: none; }
.prompt-input:focus { border-color: #ff5983; }
.btn-cancel { background: #eeeeee; color: #333333; padding: 8px 18px;border-radius: 4px;}
.btn-confirm { background: #ff5983; color: #ffffff; padding: 8px 18px;border-radius: 4px;}
.video-thumbs { list-style: none; padding: 0; margin: 0; }
.thumb-li { padding-bottom: 20%; height: 70px; flex-shrink: 0; background-position: center; background-size: cover; background-repeat: no-repeat; overflow: hidden; position:relative; }
.thumb-li.single-card { width:65%; height: auto; padding-bottom: 35%; }
.play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; width:38px;height:38px; }
</style>
</head>
<body>
<div class="contant">
    <div class="header">
        <div class="top">
            <div class="logo" id="logo"></div>
        </div>
    </div>
    <div class="navbar">
        <ul>
            <li><a id="Pic" href="javascript:void(0);" onclick="Pic()">图床</a></li>
            <li><a id="Mid" href="javascript:void(0);" onclick="Mid()">音乐</a></li>
            <li><a id="Flv" href="javascript:void(0);" onclick="Flv()">短剧</a></li>
            <li><a id="LOL" href="javascript:void(0);" onclick="LOL()">沙雕</a></li>
        </ul>
    </div>
    <div id="Mid-assort" class="wrapper">
        <div class="search">
            <div class="search-input">
                <div class="input-wrapper">
                    <input maxlength="140" enterkeyhint="search" autocomplete="off" type="search" class="input" id="Mid-input" placeholder="请输入歌名">
                </div>
            </div>
            <div class="search-btn" onclick="search_click('#Mid-input')">确 定</div>
        </div>
        <div id="Mid-key"></div>
        <div id="Mid-data"></div>
    </div>
    <div id="Flv-assort" class="wrapper">
        <div class="search">
            <div class="search-input">
                <div class="input-wrapper">
                    <input maxlength="140" enterkeyhint="search" autocomplete="off" type="search" class="input" id="Flv-input" placeholder="请输入短剧名">
                </div>
            </div>
            <div class="search-btn" onclick="search_click('#Flv-input')">搜 剧</div>
        </div>
        <div id="Flv-key"></div>
        <div id="Flv-data"></div>
    </div>
    <div id="LOL-assort" class="wrapper">
        <div id="LOL-data"></div>
        <div id="LOL-loadMore" class="loadMore"></div>
    </div>
    <div id="Pic-assort" class="wrapper">
        <fieldset>
            <legend>图床使用说明</legend>
            <p>1、图片托管于各大官网，最大支持10MB；</p>
            <p>2、禁止上传违规图片，造成后果自负；</p>
            <p>3、<a href="https://s.qiniu.com/eEFNBz" target="_blank" style="color:red;">七牛云存储</a>
            <a href="https://mp34.lanzout.com/iP8pR230laif" target="_blank" style="color:#0c6ad4;">七牛图床源码下载</a>
            </p>
        </fieldset>
        <div class="Pic-label">
            <label data-hover="推荐使用"><input type="radio" name="type" value="sh">搜狐</label>
            <label data-hover="推荐使用"><input checked type="radio" name="type" value="mt">美图</label>
            <label data-hover="腾讯云存储"><input type="radio" name="type" value="tx">腾讯</label>
            <label data-hover="备用接口"><input type="radio" name="type" value="qt">其他</label>
        </div>
        <div id="PicUpload">
            <svg width="48" height="48" xmlns="http://www.w3.org/2000/svg" viewBox="3 6 12 12"><path d="M11.61 8.57c.15.01.28.1.34.23l3 6.01c.07.13.06.29-.02.42-.08.13-.22.21-.37.21H3.43c-.16 0-.3-.08-.38-.22-.07-.14-.07-.3.01-.43l2.14-3.33c.07-.12.2-.19.33-.2.14-.01.27.06.36.16l1.8 2.16 3.53-4.71c.09-.12.23-.19.38-.18zM6.86 6c.71 0 1.29.58 1.29 1.29 0 .71-.58 1.29-1.29 1.29-.71 0-1.29-.58-1.29-1.29 0-.71.58-1.29 1.29-1.29z" fill="#ff5983" fill-rule="nonzero"></path></svg>
            <p id="uploadTip">选择或拖拽图片到此处，支持多图上传</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none;">
        </div>
<div id="uploadProgressWrap" style="margin:8px 10px;display:none;">
    <div style="height:8px;background:#eee;border-radius:4px;overflow:hidden;"><div id="uploadProgressBar" style="width:0%;height:100%;background:#ff5983;transition:0.15s;"></div></div>
    <div style="text-align:center;margin-top:4px;font-size:13px;color:#666;">
        <span id="uploadProgressText">0%</span>
    </div>
</div>
        <div id="Pic-data"></div>
    </div>
    <div class="bottom">
        <div class="childdiv"><a href="./">主页</a></div>
        <div class="childdiv"><a href="javascript:scroll(0,0)"><b>圈子</b></a></div>
    </div>
</div>
<div id="modal-mask">
    <div id="modal-box"></div>
</div>
<div id="toast-box"></div>
<script>
if (/\/\/www\./i.test(location.href)) location.href = location.href.replace(/\/\/www\./i,"//");
let canExecute = true;
let picEventBind = false;
let _loadingTimer = null;
// 全局事件委托
document.addEventListener('click',function(e){
    const midItem = e.target.closest('[data-mid-item]');
    if(midItem){
        const id = midItem.dataset.midId;
        const key = midItem.dataset.midKey;
        Mid_url(id,key);
    }
    const picCopyEl = e.target.closest('[data-copy-url]');
    if(picCopyEl){
        const url = picCopyEl.dataset.copyUrl;
        copytxt(url);
    }
    const flvItem = e.target.closest('.flv-item-click');
    if(flvItem){
        const idx = Number(flvItem.dataset.flvIdx);
        if(window._flvList && window._flvList[idx]){
            Flv_data(JSON.stringify(window._flvList[idx]));
        }
    }
})

window.onload = function(){
    const hash = location.hash.replace("#","");
    const handler = {"v":Flv,"s":LOL,"m":Mid};
    (handler[hash] || Pic)();
}
function search_click(keySel){
    const input = document.querySelector(keySel);
    const txt = input.value.trim();
    if(txt.length === 0){
        showToast("请输入关键词！");
        input.focus();
        return false;
    }
    if(keySel === '#Mid-input') Mid_so(txt);
    else if (keySel === '#Flv-input') Flv_search(txt);
}
function Mid(){
    document.querySelector("#LOL-assort").style.display = "none";
    document.querySelector("#LOL").classList.remove("xhx");
    document.querySelector("#Flv").classList.remove("xhx");
    document.querySelector("#Flv-assort").style.display = "none";
    document.querySelector("#Pic-assort").style.display = "none";
    document.querySelector("#Pic").classList.remove("xhx");
    document.querySelector("#Mid-assort").style.display = "block";
    document.querySelector("#Mid-key").style.display = "block";
    document.querySelector("#Mid-data").style.display = "none";
    document.querySelector("#Mid").classList.add("xhx");
    document.querySelector("#Mid-input").value = "";
    location.hash = "m";
    document.title = "搜音库-你想要的的歌曲库";
    document.querySelector("#logo").style.backgroundImage = "url('https://img0.baidu.com/it/u=3244688120,588283986&fm=253')";
    const Midkey = document.querySelector("#Mid-key").innerHTML.trim();
    if(Midkey.length === 0) CATCH("Mid_hot","music&ac=hot");
}
function Mid_hot(list) {
    if (list.msg){
        const data  = list.data;
        window.localStorage.setItem('Kimg', list.Kimg);
        let html = "";
        for (let i = 0; i < data.length; i++) {
            const item = data[i];
            if (item.name && item.name.trim().length !== 0){
                html += `<li><div data-mid-item data-mid-id="${item.id}" data-mid-key="${item.Key}" style="width:100%;padding-bottom:100%;border-radius:8px;overflow:hidden;background-repeat:no-repeat;background-position:center;background-size:cover;position:relative;display:block;background-image:url(${item.img});"></div><span>${item.name}</span><span>${item.author}</span></li>`;
            }
        }
        document.querySelector("#Mid-key").innerHTML = html;
    } else showToast(list.data);
}
function Mid_so(txt){
    const tk = localStorage.getItem('tk');
    if (tk === null) {
        const modalHtml = `<div class="prompt-wrap"><div class="prompt-row-flex"><input type="text" id="tk-input" class="prompt-input" placeholder="请输入秘钥"><button type="button" class="btn-confirm" onclick="wedSubmitHandler()">确定</button><button type="button" class="btn-cancel" onclick="eject(localStorage.getItem('Kimg'),'img');">获取秘钥</button></div></div>`;
        window.wedSubmitHandler = function(){
            const rVal = document.querySelector("#tk-input").value.trim();
            if(isEmpty(rVal)){ closeModal(); return; }
		    Mid_data(txt,rVal);
	    };
	    openModal(modalHtml);
	    setTimeout(()=>{const inputEl = document.querySelector("#tk-input");if(inputEl) inputEl.focus();}, 50);
    } else Mid_data(txt,tk);
}
function Mid_data(txt,key) {
	closeModal();
    GP_data("music",{method:'GET',data:{wd:txt,key:key}},res=>{
        if (res.msg){
            const json = res.data;
            let html = "";
            for (let i = 0; i < json.length; i++) {
                const d = json[i];
                if (!d.id) continue;
                html += `<div class="result-list-item"><div class="result-content"><div class="result-content-left"><div class="result-logo" style="background-image:url(https://img0.baidu.com/it/u=2529435642,894436921&fm=253);"></div><div class="result-value"><a href="javascript:void(0);" data-mid-item data-mid-id="${d.id}" data-mid-key="${d.Key}">${d.artists} - ${d.name}</a></div></div><div class="result-list-right"><div class="result-list-value">${d.duration}</div></div></div></div>`;
            }
            document.querySelector("#Mid-data").innerHTML = html;
            document.querySelector("#Mid-data").style.display = "block";
            document.querySelector("#Mid-key").style.display = "none";
			localStorage.setItem('tk', key);
			document.getElementById("Mid-input").value = '';
        }else{
            if (res.key) localStorage.removeItem('tk');
            showToast(res.data);
            document.getElementById("Mid-input").value = '';
        }
    })
}
function Mid_url(id,tk) {
    if (!canExecute) { showToast("请稍后..."); return; }
    canExecute = false;
    GP_data("music",{method:'GET',data:{id:id,key:tk}},list=>{
        if (list.msg){
            const d = list.data;
            const content = `<div class="audio-player-modal" style="position:relative;display:flex;gap:10px;align-items:center;padding:10px;"><button onclick="closeModal()" style="position:absolute;top:4px;right:10px;border:none;background:transparent;font-size:24px;color:#999;cursor:pointer;z-index:10;">×</button><div style="width:70px;height:70px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${d.img}" style="width:100%;height:100%;object-fit:cover;"></div><div style="flex:1;"><h4>${d.artist} - ${d.name}</h4><div style="padding-top:10px;display:flex;align-items:center;"><audio style="height:30px;width:100%;" controls preload="auto" oncontextmenu="return false;"><source src="${d.url}" type="audio/mpeg"></div></div></div>`;
            openModal(content);
        } else{
			showToast(list.data);
		} 
    })
    setTimeout(()=>{ canExecute = true; },4000);
}
function Flv(){
    document.querySelector("#Mid").classList.remove("xhx");
    document.querySelector("#Mid-assort").style.display = "none";
    document.querySelector("#LOL-assort").style.display = "none";
    document.querySelector("#LOL").classList.remove("xhx");
    document.querySelector("#Pic").classList.remove("xhx");
    document.querySelector("#Pic-assort").style.display = "none";
    document.querySelector("#Flv").classList.add("xhx");
    document.querySelector("#Flv-assort").style.display = "block";
    document.querySelector("#Flv-key").style.display = "block";
    document.querySelector("#Flv-data").style.display = "none";
    document.querySelector("#Flv-input").value = '';
    location.hash = "v";
    document.title = "短剧池-全网短剧集聚地";
    document.querySelector("#logo").style.backgroundImage = "url('https://img0.baidu.com/it/u=3599983424,3153659671&fm=253')";
    const playkey = document.querySelector("#Flv-key").innerHTML.trim();
    if(playkey.length === 0) CATCH("Flv_hot","vod&ac=hot");
}
function Flv_hot(list) {
    document.querySelector("#Flv-key").innerHTML = "";
    document.querySelector("#Flv-key").style.display = "block";
    document.querySelector("#Flv-data").style.display = "none";
    if (list.msg){
        const data  = list.data;
        window._flvList = data;
        let html = "";
        for (let i = 0; i < data.length; i++) {
            const item = data[i];
            html += `<li><div class="flv-item-click" data-flv-idx="${i}" style="width:100%;padding-bottom:139%;border-radius:8px;background-repeat:no-repeat;background-position:center;background-size:cover;position:relative;display:block;background-image:url(${item.cover});"><svg class="play-btn" width="36" height="36"><circle cx="18" cy="18" fill="#FFF" fill-opacity=".80" r="18"></circle><path d="M25.417 18.53L14.738 24.985a0.6 0.6 0 0 1-.832-.215 0.625 0.625 0 0 1-.085-.315V11.545c0-.341.271-.617.606-.617.11 0 .216.03.31.086l10.68 6.455a0.622 0.622 0 0 1 0 1.06z" fill="#444" fill-rule="nonzero"></path></svg></div><span>${item.name}</span><span>${item.marks}</span></li>`;
        }
        document.querySelector("#Flv-key").innerHTML = html;
    } else showToast(list.data);
}
function Flv_search(txt) {
    GP_data("vod",{method:'GET',data:{wd:txt}},res=>{
        if (res.msg) Flv_hot(res);
        else showToast(res.data);
    })
}
function Flv_data(jsonStr) {
    document.querySelector("#Flv-data").innerHTML = "";
    document.querySelector("#Flv-data").style.display = "block";
    document.querySelector("#Flv-key").style.display = "none";
    document.querySelector("#Flv-input").value = "";
    try {
        const item = JSON.parse(jsonStr);
        let htmlAll = "";
        for (let k = 0; k < item.episode.length; k++) {
            htmlAll += `<div class="result-list"><div class="result-list-item"><p style="color:#0c6ad4;font-weight:700;font-size:16px;">${item.name.replace(/\d+[-,、.]/g, '')}-${item.type}</p><p>视频来自网络,别信视频广告,谨防上当受骗!</p><a href="${item.episode[k].url}" target="_blank" style="background-color:#ff5983;color:white;text-align:center;display:inline-block;padding:2px 5px;margin:3px;border-radius:5px;">${item.episode[k].name}</a></div></div>`;
        }
        document.querySelector("#Flv-data").innerHTML = htmlAll;
    } catch (err) {
        console.error("短剧解析错误：", err);
        showToast("短剧数据解析失败");
    }
}
function LOL(){
    document.querySelector("#Mid-assort").style.display = "none";
    document.querySelector("#Mid").classList.remove("xhx");
    document.querySelector("#Pic-assort").style.display = "none";
    document.querySelector("#Pic").classList.remove("xhx");
    document.querySelector("#Flv-assort").style.display = "none";
    document.querySelector("#Flv").classList.remove("xhx");
    document.querySelector("#LOL-assort").style.display = "block";
    document.querySelector("#LOL").classList.add("xhx");
    location.hash = "s";
    document.title = "搞笑圈子-我的快乐源泉";

let isLoadingLOL = false;
function LOL_data(num) {

    const page = isNaN(num) ? 1 : Number(num);

    GP_data("other", { method: 'GET', data:{pg:page} }, list=>{

            showToast(list.data);

        } else {
            let htmlWrap = "";

                    }
                }
                htmlWrap += `<div class="itemg"><div class="itemg_lf"><img src="${item.avatar}" alt=""></div><div class="itemg_rg"><div class="itemg_rg_tp"><h4>${item.user}</h4></div><div class="itemg_rg_sm">${item.title}</div><div class="itemg_rg_main"><ul class="video-thumbs">${outimg}</ul></div></div></div>`;

function Pic(){
    document.querySelector("#Mid-assort").style.display = "none";
    document.querySelector("#Mid").classList.remove("xhx");
    document.querySelector("#Flv-assort").style.display = "none";
    document.querySelector("#Flv").classList.remove("xhx");
    document.querySelector("#LOL-assort").style.display = "none";
    document.querySelector("#LOL").classList.remove("xhx");
    document.querySelector("#Pic").classList.add("xhx");
    document.querySelector("#Pic-assort").style.display = "block";
    location.hash = "t";
    document.title = "图床-免费图片托管链接";
    document.querySelector("#logo").style.backgroundImage = "url('https://img0.baidu.com/it/u=1895635493,1543052772&fm=253')";
    if (localStorage.getItem("img")){
        const arrr = localStorage.getItem("img").split(",");
        let data = '';
        for (let i = 0; i < arrr.length; i++ ){
            const url = arrr[i];
            data += `<li style="height:0;padding-bottom:30%;"><span data-copy-url="${url}" style="background-image:url('${url}');background-position:center;background-size:cover;position:absolute;width:100%;height:100%;cursor:pointer;" title="点击复制图链"></span></li>`;
        }
        document.querySelector("#Pic-data").innerHTML = data;
        document.querySelector("#Pic-data").style.display = "block";
    }
    const PicUpload = document.querySelector("#PicUpload");
    const fileInput = document.querySelector("#fileInput");
    const uploadTip = document.querySelector("#uploadTip");
    const progressWrap = document.querySelector("#uploadProgressWrap");
    const progressBar = document.querySelector("#uploadProgressBar");
    const progressText = document.querySelector("#uploadProgressText");
    const originTipText = "选择或拖拽图片到此处，支持多图上传";
    if(!picEventBind){
        picEventBind = true;
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        function highlight() { PicUpload.classList.add('highlight'); }
        function unhighlight() { PicUpload.classList.remove('highlight'); }
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => { PicUpload.addEventListener(eventName, preventDefaults, false); });
        ['dragenter', 'dragover'].forEach(eventName => { PicUpload.addEventListener(eventName, highlight, false); });
        ['dragleave', 'drop'].forEach(eventName => { PicUpload.addEventListener(eventName, unhighlight, false); });
        PicUpload.addEventListener('click', e=>{
            e.stopPropagation();
            fileInput.click();
        });
        fileInput.addEventListener('change', e=>{ handleFiles(e); fileInput.value = ""; });
        PicUpload.addEventListener('drop', e=> handleFiles({ target: { files: e.dataTransfer.files } }));
    }
	async function handleFiles(e) {
        const files = Array.from(e.target.files);
        const MAX_SIZE=10*1024*1024;
        let uploadType = "";
        document.querySelectorAll('input[name="type"]').forEach(radio=>{ if (radio.checked) uploadType = radio.value; });
        if (files.length === 0) return showToast("未选择文件！");
        if (!uploadType) return showToast("请选择上传接口！");
        progressWrap.style.display = "block";
        for (const file of files) {
            if(file.size>MAX_SIZE){
                showToast(`【${file.name}】超过限制，无法添加`);
                continue;
            }
            await new Promise(resolve=>{
                const formData = new FormData();
                formData.append("file", file);
                formData.append("type", uploadType);
                let progress = 0;
                const progressTextEl = document.querySelector("#uploadProgressText");
                const progressBarEl = document.querySelector("#uploadProgressBar");
                progressBarEl.style.width = '0%';
                progressTextEl.innerText = '0%';
                uploadTip.textContent = '开始上传...';
                const progressInterval = setInterval(() => {
                    if (progress < 95) {
                        progress += 2;
                        progressBarEl.style.width = progress + '%';
                        progressTextEl.innerText = progress + '%';
                        if (progress < 10) {
                            uploadTip.textContent = '正在准备上传...';
                        } else if (progress < 50) {
                            uploadTip.textContent = '正在上传文件...';
                        } else {
                            uploadTip.textContent = '正在处理图片...';
                        }
                    }
                },1000);
		    	GP_data("upimg",{upfile:'upfile',data:formData},(list)=>{
                    clearInterval(progressInterval);
                    progressBarEl.style.width = '100%';
                    progressTextEl.innerText = '100%';
                    try{
                        if(list.msg){
                            uploadTip.textContent = '上传完成';
                            showToast("上传成功，点击图片复制！");
                            const imgUrl = list.data.img;
                            document.querySelector("#Pic-data").insertAdjacentHTML('afterbegin', `<li style="height:0;padding-bottom:30%;"><span data-copy-url="${imgUrl}" style="background-image:url('${imgUrl}');background-position:center;background-size:cover;position:absolute;width:100%;height:100%;cursor:pointer;" title="点击复制图链"></span></li>`);
                            addlocal('img', imgUrl);
                        }else{
                            uploadTip.textContent = '上传失败';
                            showToast(`${file.name}：${list.data}`);
                        }
                    }catch(err){
                        uploadTip.textContent = '上传失败';
                        showToast(`${file.name}：接口返回解析异常`);
                    }
                    resolve();
                });
            })
        }
        uploadTip.textContent = originTipText;
        progressWrap.style.display = "none";
        document.querySelector("#uploadProgressBar").style.width = "0%";
        document.querySelector("#uploadProgressText").innerText = "0%";
    }
}
function addlocal(type,value){
    let old = localStorage.getItem(type);
    let arr = old ? old.split(',') : [];
    arr.unshift(value);
    arr = [...new Set(arr)];
    if(arr.length>50) arr.length=50;
    localStorage.setItem(type, arr.join(','));
}
function eject(u,t,i,a) {
	const taskeject = showLoading();
    if (t == "img"){
        let x = '';
        if(i||a) { x = `<p>图片链接：<a href="javascript:void(0);" onclick="copytxt('${u}')">${u}</a></p><p>上传时间：${a}</p><p>上传地址：<span id="ipres"><a href="javascript:void(0);" onclick="check_ip('${i}')">${i}</a></span></p>`; }
        const pic = new Image();
        pic.onload = function () { const html = x +`<img width="100%" src="${u}" onclick="closeModal()">`; openModal(html, false); hideLoading(taskeject); }
        pic.onerror = function() { hideLoading(taskeject); showToast("图片加载失败！"); }
        pic.src = u;
    }else if(t == "video"){
        const html = `<video id="myVideo" controls width="100%" height="100%" oncontextmenu="return false;" controlslist="nodownload" poster="" x5-playsinline="true" playsinline="true" webkit-playsinline="true"><source src="${u}" type="video/mp4"></video>`;
        openModal(html, true);
        setTimeout(()=>{
            const video = document.getElementById('myVideo');
            if(!video){ hideLoading(taskeject); return; }
            function onVideoReady(){
                hideLoading(taskeject);
                video.removeEventListener('loadedmetadata', onVideoReady);
                video.removeEventListener('canplay', onVideoReady);
                video.removeEventListener('playing', onVideoReady);
                video.removeEventListener('error', onVideoError);
            }
            function onVideoError(){
                hideLoading(taskeject);
                showToast("视频加载失败");
                video.removeEventListener('loadedmetadata', onVideoReady);
                video.removeEventListener('canplay', onVideoReady);
                video.removeEventListener('playing', onVideoReady);
                video.removeEventListener('error', onVideoError);
            }
            video.addEventListener('loadedmetadata', onVideoReady);
            video.addEventListener('canplay', onVideoReady);
            video.addEventListener('playing', onVideoReady);
            video.addEventListener('error', onVideoError);
            video.play().catch(e=>{});
            video.addEventListener('ended',()=>{ video.currentTime=0; video.play().catch(e=>{}); });
            video.addEventListener('touchstart',closeModal);
        }, 50);
    }
}
async function copytxt(d) {
    try {
        await navigator.clipboard.writeText(d);
        showToast("复制成功！");
    } catch(e) {
        const input = document.createElement('input');
        input.setAttribute('readonly', 'readonly');
        input.value = d;
        document.body.appendChild(input);
        input.select();
        document.execCommand('Copy');
        document.body.removeChild(input);
        showToast("复制成功！");
    }
}
function isEmpty(value) {
    return value === null || value === undefined || value === "" || (typeof value === "string" && value.trim() === "");
}
// 补零日期
function getToday() {
    let date = new Date();
    let Y = date.getFullYear();
    let M = String(date.getMonth()+1).padStart(2,'0');
    let D = String(date.getDate()).padStart(2,'0');
    let H = String(date.getHours()).padStart(2,'0');
    return `${Y}-${M}-${D}-${H}`;
}
function CATCH(KEY, URL) {
    let cacheRaw = localStorage.getItem(KEY);
    let data = null;
    try{ data = JSON.parse(cacheRaw); }catch(e){}
    if (data !== null && data.validDate === getToday()) {
        try{
            if(typeof window[KEY] === 'function') window[KEY](data.list);
        }catch(err){ console.warn("缓存回调异常",err); }
    } else {
        GP_data(URL,{method:'GET'},list=>{
            if (list.msg){
                localStorage.setItem(KEY, JSON.stringify({ list, validDate: getToday() }));
                try{
                    if(typeof window[KEY] === 'function') window[KEY](list);
                }catch(err){ console.warn("接口回调异常",err); }
            } else{
                showToast(list.data);
			}
        })
    }
}
function showToast(text, delay = 1700) {
    const toast = document.querySelector("#toast-box");
    toast.innerText = text;
    toast.style.display = 'block';
    setTimeout(()=>toast.style.display = 'none', delay);
}
function openModal(html, isVideo = false) {
    const mask = document.querySelector("#modal-mask");
    const box = document.querySelector("#modal-box");
    const closeBtnHtml = isVideo ? '' : `<button class="modal-close-btn" onclick="closeModal()">×</button>`;
    box.innerHTML = closeBtnHtml + html;
    box.className = 'modal-box';
    if(isVideo) box.classList.add('video-modal');
    mask.style.display = 'flex';
    document.body.classList.add("modal-open");
    mask.onclick = function(e){
        if(e.target !== mask) return;
        if(box.classList.contains('video-modal')) return;
        closeModal();
    }
    box.onclick = function(e){ e.stopPropagation(); }
}
function closeModal() {
    const mask = document.querySelector("#modal-mask");
    const box = document.querySelector("#modal-box");
    mask.style.display = "none";
    box.innerHTML = '';
    box.className = 'modal-box';
    document.body.classList.remove("modal-open");
}

function showLoading(tid) {
    if(tid === undefined){
        tid = 'load_' + Math.random().toString(36).slice(2);
    }else{
        tid = 'load_' + tid;
    }
    let el = document.getElementById(tid);
    if(el){ return tid; }
    const html = `<div id="${tid}" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.2);z-index:10000;display:flex;align-items:center;justify-content:center;"><div style="width:30px;height:30px;border:3px solid #ff5983;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    return tid;
}
function hideLoading(taskId) {
    if(!taskId) return;
    const el = document.getElementById(taskId);
    if(el){
        el.remove();
    }
}
async function GP_data(txt, options, callback) {
	const taskId = showLoading();
    const opts = options || {};
    const {method = 'POST' , data = {} , headers = {} , upfile = '' } = opts;
    let apiUrl = "https://api.rmbk.cc/i6x.php?type=" + txt;
	const finalTimeout = upfile === 'upfile' ? 90000 : 30000;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), finalTimeout);
    try {
        const fetchConfig = {
            method: method.toUpperCase(),
            signal: controller.signal,
            headers: { ...headers }
        };
        if (fetchConfig.method === 'GET') {
            const urlParams = new URLSearchParams();
            for(const k in data){
                urlParams.append(k, data[k]);
            }
            const appendQuery = urlParams.toString();
            if(appendQuery){
                apiUrl += "&" + appendQuery;
            }
        }else{
            if (upfile === 'upfile') {
                fetchConfig.body = data;
            } else {
                const params = new URLSearchParams();
                for (const key in data) params.append(key, data[key]);
                fetchConfig.body = params.toString();
                fetchConfig.headers['Content-Type'] = 'application/x-www-form-urlencoded';
            }
        }
        const res = await fetch(apiUrl, fetchConfig);
        if (!res.ok) throw new Error('http status:' + res.status);
        const result = await res.json();
        callback(result);
    } catch (err) {
		console.log(err);
        callback({ msg: false, data: err.message || String(err) });
    } finally {
		hideLoading(taskId);
        clearTimeout(timer);
    }
}
